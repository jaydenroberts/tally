name: trivy image scan (reusable)

# Called by dependency-audit.yml (on pull requests and pushes touching
# dependency files, plus a weekly schedule) and by docker-publish.yml at
# release time. Kept as one implementation so a future change to the severity
# threshold or the scan configuration only has to happen in one place.

on:
  workflow_call: {}

permissions: {}

jobs:
  scan:
    name: trivy-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repository Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (local only, never pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: tally:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: an operating-system package advisory with no available
      # fix would otherwise fail this job indefinitely, regardless of anything
      # this project does. Those findings are still uploaded to the Security
      # tab below so they stay visible; they just do not block. Anything at
      # CRITICAL or HIGH that does have a fix available still blocks.
      - name: Scan the built image for known advisories
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: "tally:audit"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: "trivy-results.sarif"
