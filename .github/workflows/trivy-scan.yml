name: trivy image scan (reusable)

# Called by dependency-audit.yml (on pull requests and pushes touching
# dependency files, plus a weekly schedule) and by docker-publish.yml at
# release time. Kept as one implementation so a future change to the severity
# threshold or the scan configuration only has to happen in one place.

on:
  workflow_call: {}

permissions: {}

jobs:
  scan:
    name: trivy-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repository Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build image (local only, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tally:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ───────────────────────────────────────────────────────────────────────
      # The scan runs TWICE, on purpose, and the two runs have different jobs.
      #
      # REPORT writes the record and can never fail this job. GATE decides
      # whether the job passes and writes nothing.
      #
      # They are separate because a trivy ignore file applies to the whole
      # invocation. With a single step, waiving one advisory to unblock a
      # release would also delete it from the Security tab — the gate and the
      # audit record would be the same object, and every unblock would silently
      # shrink the record. Split, the ignore file attaches to GATE only and a
      # waived advisory stays fully visible in REPORT.
      #
      # REPORT runs first, also on purpose. If GATE ran first, a failure would
      # skip REPORT and nothing would reach the Security tab on exactly the runs
      # where the record matters most.
      # ───────────────────────────────────────────────────────────────────────

      # REPORT — every severity, no ignore file, no exit code.
      #
      # ignore-unfixed is kept here: an advisory with no available fix is noise
      # in a record meant to be read, and there are a lot of them. Note that
      # this means unfixed advisories are NOT in the Security tab. An earlier
      # version of this file claimed the opposite; it was wrong, because
      # ignore-unfixed applies to the same invocation that writes the SARIF.
      # If that promise should be made true, drop ignore-unfixed from THIS step
      # only — never from GATE, which would then block on advisories this
      # project cannot fix.
      #
      # limit-severities-for-sarif is set false explicitly. The action DISCARDS
      # the severity input whenever the format is sarif unless this is the exact
      # lowercase string "true", so a severity filter written here would be a
      # comment that does not match behaviour. No severity input is set on this
      # step, so there is nothing to discard — the false is a guard against
      # someone adding one later and believing it.
      - name: Report — record every finding to the Security tab
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "tally:audit"
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          limit-severities-for-sarif: false

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: "trivy-results.sarif"

      # GATE — CRITICAL and HIGH with a fix available, and nothing else.
      #
      # format: table, not sarif. The action honours the severity input in table
      # format, and the findings land in the job log where whoever is unblocking
      # a build will actually read them.
      #
      # There is no ignore file. .trivyignore.gate was deleted on 2026-09-19:
      # starlette 1.6.0 (PR #40) fixed the only two advisories it ever waived,
      # and the built image now scans clean with no suppressions at all.
      #
      # If a build is blocked here, do not lower the severity threshold: that
      # scopes nothing and weakens every future run. Reinstate a scoped waiver
      # instead, as a named and dated entry carrying an exit condition. Two
      # things matter when you do. Recreate the file as .trivyignore.gate and
      # nothing else: .trivyignore is trivy's default ignore-file name and would
      # be picked up automatically by the REPORT step above, which is the exact
      # property this split exists to prevent, so every waived advisory would
      # vanish from the Security tab as well as from the gate. Verified
      # 2026-09-17 against trivy 0.70.0 - with the .gate name, the REPORT
      # invocation still records suppressed advisories in full. And add the file
      # and the trivyignores input below in the same commit: trivy-action's
      # entrypoint hard-errors ("cannot find ignorefile") and exits 1 when a file
      # named in trivyignores is missing, so either half alone turns every run
      # red.
      #
      - name: Gate — fail on fixable CRITICAL or HIGH
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "tally:audit"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
