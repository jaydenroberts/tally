name: Publish Tally image (GHCR + DockerHub)

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: nothing by default, granted per-job.
permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate tag, version constant, and changelog
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tag:      ${TAG}"
          echo "version:  ${VERSION}"

          FAIL=0

          # Check 1: tag format vX.Y.Z or vX.Y.Z.N.
          if printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "✓ tag '${TAG}' matches vX.Y.Z or vX.Y.Z.N"
          else
            echo "✗ tag '${TAG}' does not match vX.Y.Z or vX.Y.Z.N"
            FAIL=1
          fi

          # Check 2: version constant in backend/app/main.py equals the released version.
          if grep -qF "version=\"${VERSION}\"" backend/app/main.py; then
            echo "✓ backend/app/main.py declares version=\"${VERSION}\""
          else
            echo "✗ backend/app/main.py does not contain version=\"${VERSION}\""
            FAIL=1
          fi

          # Check 3: matching CHANGELOG entry.
          ESCAPED="$(printf '%s' "${VERSION}" | sed 's/\./\\./g')"
          if grep -qE "^## \[${ESCAPED}\]" CHANGELOG.md; then
            echo "✓ CHANGELOG.md has an entry for '${VERSION}'"
          else
            echo "✗ CHANGELOG.md is missing a '## [${VERSION}]' entry"
            FAIL=1
          fi

          if [ "${FAIL}" -ne 0 ]; then
            echo "validate failed: release '${TAG}' is out of spec — refusing to build/push"
            exit 1
          fi
          echo "validate passed: '${TAG}' is in spec"

  # Publish-time gate. This job exists because the tag path had no scan of any
  # kind: the PR scan runs on `pull_request`, so a tag push reached a published
  # image without a single byte being examined. That is not theoretical — tag
  # v1.1.1 published a full personal profile in April 2026 and no gate could see
  # it, because a diff scan structurally cannot: the content did not change in the
  # commit the tag points at, it was simply present in the tree.
  #
  # So this scans the TREE at the tag, which is the only thing that answers "what
  # is actually inside the artifact we are about to publish". It gates the build
  # via `needs`, so a finding means no image is ever pushed.
  scan-tag-tree:
    name: scan-tag-tree
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up scan patterns
        id: patterns
        uses: ./.github/actions/scan-patterns
        with:
          patterns-b64: ${{ secrets.SCAN_PATTERNS_B64 }}

      - name: Personal-data scan — full tree at tag
        env:
          PATTERN_DIR: ${{ steps.patterns.outputs.pattern-dir }}
        run: |
          set -euo pipefail
          echo "Scanning every blob in the tree at ${GITHUB_REF_NAME}"
          ci/scanner.sh --ci --tree HEAD

  # Same publish-time-gate reasoning as scan-tag-tree above, applied to known
  # advisories instead of personal data. A dependency audit that ran against
  # main days or weeks ago does not establish that the base images are still
  # clean by the time this tag is built. This scans the actual artifact,
  # immediately before it ships, and gates the push via `needs`.
  scan-image:
    name: scan-image
    needs: [validate]
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml

  build-and-push:
    name: build-and-push
    needs: [scan-tag-tree, validate, scan-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout
      packages: write       # push image + attestation to GHCR
      id-token: write       # keyless OIDC signing (attest-build-provenance)
      attestations: write   # write attestation to the GitHub attestations store

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # QEMU lets this amd64 runner build and run the linux/arm64 image.
      # Only arm64 is registered, not the action's default of every platform.
      # The binfmt image runs --privileged on the runner, so it is pinned by
      # digest like every action here (the action's default is an unpinned
      # :latest). The digest is tonistiigi/binfmt:qemu-v10.2.3. cache-image is
      # off so the action's cache key never has to handle a digest reference;
      # the image is small and pulling it costs seconds.
      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # ARM smoke gate. No ARM hardware is available to the project, so before
      # anything is pushed, build the arm64 image on its own, load it into the
      # runner's Docker, start it under emulation, and require a healthy
      # response that reports THIS release's version. A failure here stops the
      # job before the push step, so a broken arm64 image never ships.
      # (The trivy scan-image gate builds and scans the amd64 image only.)
      - name: Build arm64 image for the smoke test (local only, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          tags: tally:smoke-arm64
          cache-from: type=gha

      - name: Smoke-test the arm64 image (emulated) — health and version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          ARCH="$(docker image inspect -f '{{.Architecture}}' tally:smoke-arm64)"
          if [ "${ARCH}" != "arm64" ]; then
            echo "✗ smoke image architecture is '${ARCH}', expected 'arm64'"
            exit 1
          fi

          # Throwaway secret and data folder; nothing here outlives the job.
          SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::${SECRET_KEY}"
          DATA_DIR="$(mktemp -d)"
          sudo chown 999:999 "${DATA_DIR}"   # the image runs as uid 999

          trap 'docker rm -f tally-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name tally-smoke --platform linux/arm64 \
            -e SECRET_KEY="${SECRET_KEY}" \
            -v "${DATA_DIR}":/data \
            -p 127.0.0.1:8091:8091 \
            tally:smoke-arm64 >/dev/null
          echo "running on: $(docker exec tally-smoke uname -m)"

          # Emulated first start is slow: allow up to ~3 minutes.
          DEADLINE=$((SECONDS + 180))
          BODY=""
          until BODY="$(curl -fsS --max-time 5 http://127.0.0.1:8091/api/health 2>/dev/null)"; do
            if [ "$(docker inspect -f '{{.State.Running}}' tally-smoke)" != "true" ]; then
              echo "✗ arm64 container exited before becoming healthy"
              docker logs tally-smoke
              exit 1
            fi
            if [ "${SECONDS}" -ge "${DEADLINE}" ]; then
              echo "✗ no healthy response from the arm64 image within 180s"
              docker logs tally-smoke
              exit 1
            fi
            sleep 5
          done

          echo "health: ${BODY}"
          if printf '%s' "${BODY}" | jq -e --arg v "${VERSION}" '.status == "ok" and .version == $v' >/dev/null; then
            echo "✓ arm64 image healthy and reports version ${VERSION}"
          else
            echo "✗ expected status 'ok' and version '${VERSION}'"
            docker logs tally-smoke
            exit 1
          fi

      - name: Log in to GHCR (primary, via built-in GITHUB_TOKEN)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub (retained for existing users)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (GHCR + DockerHub) with provenance + SBOM
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jaydenroberts/tally:${{ steps.version.outputs.VERSION }}
            ghcr.io/jaydenroberts/tally:latest
            jaydenroberts/tally:${{ steps.version.outputs.VERSION }}
            jaydenroberts/tally:latest
          provenance: true   # SLSA provenance as OCI attestation manifest (both registries)
          sbom: true         # SBOM as OCI attestation manifest (both registries)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR image, keyless OIDC / Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jaydenroberts/tally
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
