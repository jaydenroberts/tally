name: Publish Tally image (GHCR + DockerHub)

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege: nothing by default, granted per-job.
permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate tag, version constant, and changelog
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "tag:      ${TAG}"
          echo "version:  ${VERSION}"

          FAIL=0

          # Check 1: tag format vX.Y.Z or vX.Y.Z.N.
          if printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "✓ tag '${TAG}' matches vX.Y.Z or vX.Y.Z.N"
          else
            echo "✗ tag '${TAG}' does not match vX.Y.Z or vX.Y.Z.N"
            FAIL=1
          fi

          # Check 2: version constant in backend/app/main.py equals the released version.
          if grep -qF "version=\"${VERSION}\"" backend/app/main.py; then
            echo "✓ backend/app/main.py declares version=\"${VERSION}\""
          else
            echo "✗ backend/app/main.py does not contain version=\"${VERSION}\""
            FAIL=1
          fi

          # Check 3: matching CHANGELOG entry.
          ESCAPED="$(printf '%s' "${VERSION}" | sed 's/\./\\./g')"
          if grep -qE "^## \[${ESCAPED}\]" CHANGELOG.md; then
            echo "✓ CHANGELOG.md has an entry for '${VERSION}'"
          else
            echo "✗ CHANGELOG.md is missing a '## [${VERSION}]' entry"
            FAIL=1
          fi

          if [ "${FAIL}" -ne 0 ]; then
            echo "validate failed: release '${TAG}' is out of spec — refusing to build/push"
            exit 1
          fi
          echo "validate passed: '${TAG}' is in spec"

  build-and-push:
    name: build-and-push
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # checkout
      packages: write       # push image + attestation to GHCR
      id-token: write       # keyless OIDC signing (attest-build-provenance)
      attestations: write   # write attestation to the GitHub attestations store

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR (primary, via built-in GITHUB_TOKEN)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub (retained for existing users)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (GHCR + DockerHub) with provenance + SBOM
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jaydenroberts/tally:${{ steps.version.outputs.VERSION }}
            ghcr.io/jaydenroberts/tally:latest
            jaydenroberts/tally:${{ steps.version.outputs.VERSION }}
            jaydenroberts/tally:latest
          provenance: true   # SLSA provenance as OCI attestation manifest (both registries)
          sbom: true         # SBOM as OCI attestation manifest (both registries)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (GHCR image, keyless OIDC / Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/jaydenroberts/tally
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
